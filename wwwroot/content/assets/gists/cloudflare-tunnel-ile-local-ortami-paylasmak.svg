<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Tunnel ile Local Ortamı Güvenle Paylaşmak</title>
  <desc id="desc">İnternet trafiğinin kimlik kontrolünden ve güvenli bir tünelden geçerek yerel geliştirme ortamına ulaştığını gösteren şematik illüstrasyon.</desc>
  <!-- semantic content asset: gists/cloudflare-tunnel-ile-local-ortami-paylasmak -->
  <defs>
