      <stop offset="0" stop-color="#e0b661" stop-opacity="0.18" />
      <stop offset="0.5" stop-color="#c89a49" stop-opacity="0.8" />
      <stop offset="1" stop-color="#7f9870" stop-opacity="0.28" />
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
